<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bot TARA - Pilih Lokasi</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 80vh;
        }

        .bottom-panel {
            padding: 15px;
            background: white;
        }

        #location-info {
            margin-bottom: 10px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0088cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="bottom-panel">

        <div id="location-info">
            Memuat lokasi...
        </div>

        <button onclick="sendLocation()">
            📍 Gunakan Lokasi Ini
        </button>

    </div>


    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        // Lokasi awal
        // Untuk sementara kita gunakan area Malang
        let initialLat = -7.9829;
        let initialLon = 112.6308;


        // Buat map
        const map = L.map("map").setView(
            [initialLat, initialLon],
            15
        );


        // OpenStreetMap
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        // Marker
        const marker = L.marker(
            [initialLat, initialLon],
            {
                draggable: true
            }
        ).addTo(map);


        updateLocationInfo(
            initialLat,
            initialLon
        );


        // Kalau marker digeser
        marker.on("dragend", function (event) {

            const position = marker.getLatLng();

            updateLocationInfo(
                position.lat,
                position.lng
            );

        });


        // Kalau user tap peta
        map.on("click", function (event) {

            const lat = event.latlng.lat;
            const lon = event.latlng.lng;

            marker.setLatLng([
                lat,
                lon
            ]);

            updateLocationInfo(
                lat,
                lon
            );

        });


        function updateLocationInfo(lat, lon) {

            document.getElementById("location-info").innerHTML =
                `
            <b>Lokasi dipilih:</b><br>
            Latitude: ${lat.toFixed(6)}<br>
            Longitude: ${lon.toFixed(6)}
            `;

        }


        function sendLocation() {

            const position = marker.getLatLng();

            const locationData = {

                latitude: position.lat,

                longitude: position.lng

            };


            // Kirim data ke Telegram Bot
            tg.sendData(
                JSON.stringify(locationData)
            );

        }

    </script>

</body>

</html>
